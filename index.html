<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B1220">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GetTogether">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GetTogether</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Nur – a reminder for new Muslims and a door for anyone who wants to explore, ask and learn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: app i én kolonne (max 680px) med bund-navigation; nattehimmel og guld som identitet, geometrisk stjernemønster bag forsiden */
:root{
  --bg:#0B1220; --surface:#121B2E; --surface2:#18243B; --ink:#EDE7DA; --muted:#9AA5B8; --line:#243150;
  --gold:#D4AF6A; --goldsoft:rgba(212,175,106,.14); --teal:#6CC0B4;
  --ok:#6CC0B4; --warn:#E3B95C; --deb:#B9A3E8; --scrim:rgba(5,9,18,.6);
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#ECEFEA; --surface:#FFFFFF; --surface2:#F5F6F2; --ink:#142030; --muted:#566273; --line:#D3D9D0;
  --gold:#94701F; --goldsoft:rgba(148,112,31,.10); --teal:#1E6D64; --ok:#1E6D64; --warn:#94650E; --deb:#5E4A93; --scrim:rgba(20,32,48,.35); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#ECEFEA; --surface:#FFFFFF; --surface2:#F5F6F2; --ink:#142030; --muted:#566273; --line:#D3D9D0;
  --gold:#94701F; --goldsoft:rgba(148,112,31,.10); --teal:#1E6D64; --ok:#1E6D64; --warn:#94650E; --deb:#5E4A93; --scrim:rgba(20,32,48,.35); color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.app{max-width:680px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.75rem;line-height:1.15}
h3{font-size:1.2rem}
p{margin:0}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
[dir="rtl"] .eyebrow{letter-spacing:0}
.muted{color:var(--muted)}
.view{display:flex;flex-direction:column;gap:18px}
.ar{font-family:var(--arabic);direction:rtl;text-align:right;line-height:2;margin:0}
.tr{font-size:.85rem;color:var(--muted);font-style:italic;direction:ltr;text-align:left}
button{font-family:var(--body)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:0 0 10px;padding:6px 0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top>#open-set{justify-self:end;grid-column:3;grid-row:1}
.top>#player,.top>#more-music{grid-column:2;grid-row:1}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
.player{justify-self:center;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;max-width:200px;min-width:0}
.player button{width:32px;height:32px;flex:none;border-radius:50%;border:0;background:var(--gold);color:var(--bg);display:grid;place-items:center;cursor:pointer}
.player span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.player i{display:block;height:2px;background:var(--gold);width:0;border-radius:2px;position:absolute;left:14px;right:14px;bottom:2px}
.counter{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:color-mix(in srgb,var(--surface) 70%,transparent)}
.counter b{color:var(--gold);font-variant-numeric:tabular-nums}
.deep{border-top:1px dashed var(--line);padding-top:10px;white-space:pre-wrap;font-size:.95rem}
.deepbtn{justify-self:start;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:5px 12px;font-size:.8rem;cursor:pointer}
.addr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);
  background:radial-gradient(120% 90% at 50% 0%,var(--surface2),var(--surface));padding:28px 22px 26px;display:flex;flex-direction:column;gap:14px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.hero>*:not(canvas){position:relative}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{font-size:clamp(1.9rem,8vw,2.6rem);line-height:1;color:var(--gold);display:grid;gap:6px}
.brand .by{font-family:var(--body);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.brand .arname{font-family:var(--arabic);font-size:2.2rem;color:var(--gold);line-height:1}
.hero .ar{font-size:clamp(1.7rem,6.5vw,2.4rem);color:var(--ink)}
.hero .meaning{font-family:var(--display);font-size:1.25rem;line-height:1.45}
.ref{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.ref b{color:var(--gold);font-weight:600}
.rowbtn{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:.85rem;cursor:pointer}
.ghost:hover{border-color:var(--gold)}
.gold{background:var(--gold);color:var(--bg);border:0;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.92rem;cursor:pointer}
.gold:disabled,.ghost:disabled{opacity:.5;cursor:default}

.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.doors{grid-template-columns:1fr}}
.door{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.door:hover{border-color:var(--gold)}
.door .ic{font-family:var(--arabic);font-size:1.6rem;color:var(--gold);line-height:1}
.door span:last-child{font-size:.88rem;color:var(--muted)}
.hadith{border-inline-start:2px solid var(--gold);padding-block:4px;padding-inline-start:16px;display:flex;flex-direction:column;gap:6px}
.hadith p:first-of-type{font-family:var(--display);font-size:1.12rem;line-height:1.5}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.check{flex:none;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:.75rem;cursor:pointer}
.check[aria-pressed="true"]{background:var(--goldsoft);border-color:var(--gold);color:var(--gold)}
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .4s}
ol,ul{margin:0;padding-inline-start:1.25em;display:grid;gap:4px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.cmp h4{margin:0 0 6px;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:start;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
th{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
td:last-child{font-variant-numeric:tabular-nums;color:var(--gold)}
.vers{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.vers>div{min-width:0;display:grid;gap:4px}
.vers .ar{font-size:1.55rem}
.nr{width:26px;height:26px;border:1px solid var(--gold);color:var(--gold);transform:rotate(45deg);display:grid;place-items:center;font-size:.72rem;margin-top:12px}
.nr span{transform:rotate(-45deg)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:11px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.msg.u{align-self:flex-end;background:var(--gold);color:var(--bg)}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.msg.wait{color:var(--muted);font-style:italic}
.composer{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px}
.composer textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;padding:6px 8px}
.composer textarea:focus-visible{outline:none}
textarea,input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
label{display:grid;gap:5px;font-size:.8rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.tl{display:flex;flex-direction:column;position:relative;padding-inline-start:22px}
.tl::before{content:"";position:absolute;inset-inline-start:6px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--gold),transparent)}
.entry{position:relative;padding-bottom:14px}
.entry::before{content:"";position:absolute;inset-inline-start:-20px;top:20px;width:9px;height:9px;transform:rotate(45deg);background:var(--bg);border:1.5px solid var(--gold)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.pill{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1px solid currentColor}
.p-kilde{color:var(--ok)} .p-tradition{color:var(--warn)} .p-debat{color:var(--deb)}
.src{font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:.75rem;color:var(--teal)}
.del{margin-inline-start:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:2px 8px;font-size:.72rem;cursor:pointer}
.scan{background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--gold);border-radius:18px;padding:18px;display:grid;gap:12px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer}
.drop:hover{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.status{font-size:.88rem;min-height:1.3em;color:var(--muted)}
.status.err{color:var(--gold)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.bottom div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.bottom button>span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.door.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;border-color:var(--gold);background:linear-gradient(160deg,var(--surface2),var(--surface))}
.door.wide>span.txt{display:flex;flex-direction:column;gap:4px;flex:1}
.door.wide .go{color:var(--gold);font-size:.88rem;white-space:nowrap}
nav.bottom button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;font-size:.74rem;border-radius:12px}
nav.bottom button .g{font-family:var(--arabic);font-size:1.25rem;line-height:1.1}
nav.bottom button[aria-current="page"]{color:var(--gold);background:var(--goldsoft)}
.foot{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin-top:20px}

.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{width:100%;max-width:680px;max-height:90%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;min-width:0}
.term b{font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--gold)}
.term .ar{font-size:1.15rem;line-height:1.6;text-align:start}
.term p{font-size:.92rem}
.helpbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--goldsoft);border:1px solid var(--gold);border-radius:16px;padding:14px 16px;margin-top:20px}
.basisbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface2);border:1px solid var(--gold);border-radius:16px;padding:16px;color:var(--ink);cursor:pointer;text-align:start}
.helpbody{display:grid;gap:14px}
.helpbody section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:8px}
.helpbody section.care{border-color:var(--gold)}
.helpbody h3{color:var(--gold)}
.know{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.know li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.know li b{display:block;font-family:var(--display);font-weight:400;font-size:1.08rem;margin-bottom:2px}
.flowcta{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--gold);border-radius:20px;padding:16px 18px;color:var(--ink);cursor:pointer;text-align:start;width:100%}
.flowcta svg{width:54px;height:54px}
.flow{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.flow>div{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;flex:1}
.ftop{display:flex;align-items:center;gap:12px}
.ftop .bar{flex:1}
.fig{display:grid;place-items:center;height:150px}
.fig svg{height:150px;width:auto}
.fstep{display:grid;gap:8px;text-align:center}
.fstep h2{font-size:1.6rem}
.fsay{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:8px}
.fsay .ar{font-size:clamp(1.5rem,6vw,2.1rem);text-align:center;line-height:2}
.fsay .tr{text-align:center}
.fsay .mean{text-align:center;font-family:var(--display);font-size:1.1rem}
.times{justify-self:center;font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.fnav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:auto}
.fnav .gold{padding:14px}
.choose{display:grid;gap:10px}
.choose button{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;color:var(--ink);cursor:pointer;font-size:1rem}
.choose button[aria-pressed="true"]{border-color:var(--gold);background:var(--goldsoft)}
.choose b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.toggle{display:flex;align-items:center;gap:10px;font-size:.95rem;color:var(--ink)}
.toggle input{width:20px;height:20px;accent-color:var(--gold)}
.langs{display:flex;flex-wrap:wrap;gap:8px;max-height:220px;overflow-y:auto;padding:2px}
.loader{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;
  padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.loader>div{display:grid;justify-items:center;gap:18px;text-align:center;max-width:320px;width:100%}
.star{width:84px;height:84px;position:relative}
.star i{position:absolute;inset:14px;border:1.5px solid var(--gold);border-radius:4px}
.star i:nth-child(2){transform:rotate(45deg)}
.star b{position:absolute;inset:34px;border-radius:50%;background:var(--gold);opacity:.85}
.loader h3{font-size:1.35rem}
.lbar{width:100%;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .5s ease}
.lbar.indef i{width:35%;animation:slide 1.2s ease-in-out infinite}
@media (prefers-reduced-motion:no-preference){.star{animation:spin 6s linear infinite}.star b{animation:pulse 1.6s ease-in-out infinite}}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(.6);opacity:.4}}@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .35s ease both}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>


<div class="app">
<div class="top"><button class="ghost" id="install" type="button" hidden style="justify-self:start;grid-column:1;grid-row:1" data-i="installBtn"></button><div class="player" id="player" hidden><button type="button" id="pl-btn" aria-label="Play"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path id="pl-ic" d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg></button></div><button class="ghost" id="open-set" type="button" aria-haspopup="dialog">🌐 <span id="langname">Dansk</span></button></div>

<section class="view" id="v-hjem">
  <div class="hero">
    <canvas id="pattern" aria-hidden="true"></canvas>
    <div class="brand"><h1>GetTogether<small class="by">by Malik</small></h1><span class="arname" lang="ar">نور</span></div>
    <div class="counter" id="counter" hidden><span id="c-me"></span><span aria-hidden="true">·</span><span id="c-all"></span></div>
    <p class="muted" style="max-width:46ch" data-i="tagline"></p>
    <div class="eyebrow" style="margin-top:8px" data-i="today"></div>
    <p class="ar" lang="ar" id="d-ar"></p>
    <p class="meaning" id="d-mean"></p>
    <div class="rowbtn" style="justify-content:space-between">
      <span class="ref"><span data-i="quran"></span> <b id="d-ref"></b></span>
      <button class="ghost" id="d-next" type="button" data-i="nextR"></button>

 helpBody:"<section><h3>Det islam selv siger</h3><ul><li>Profeten sagde: gør det let, og gør det ikke svært (Bukhari 69).</li><li>Søg tilflugt med de korte ord: <i>A'udhu billahi min ash-shaytan ir-rajim</i>, jeg søger tilflugt hos Gud mod den forbandede Satan.</li><li>Læs de to sidste suraer, al-Falaq og an-Nas. An-Nas handler netop om at søge beskyttelse mod hvisken (waswasa).</li><li>Din krop har ret over dig. Sov, spis, gå en tur, og hold en pause fra at læse.</li></ul></section><section><h3>Tal med et menneske</h3><p>En imam, en ven eller en i familien. Du skal ikke bære det hele alene, og en samtale hjælper mere end mere viden.</p></section><section class='care'><h3>Hvis hvisken føles som stemmer</h3><p>Hvis du hører stemmer, som andre ikke hører, ikke sover, eller får en stærk følelse af, at alt handler om dig, eller at du er udvalgt, så tal med en læge. Mange imamer siger det samme: hvisken og sygdom er to forskellige ting, og at søge behandling strider ikke mod troen. Profeten sagde: søg behandling, for Gud har ikke skabt en sygdom uden også at skabe et middel mod den (Abu Dawud 3855).</p><p><b>Livslinien:</b> 70 201 201 · <b>Psykiatrifonden:</b> 39 25 25 25 · <b>Akut fare:</b> 112</p></section>",

 basisH:"Words and things you should know",basisNote:"The words you hear at the mosque and among Muslims, explained simply. And the things new Muslims often wish someone had told them from the start.",
 knowH:"Things you should know",termsH:"Glossary",termsSearch:"Search for a word …",
 know:"<li><b>You don't have to know everything at once.</b>Islam is learned over years. The Prophet said: make things easy, and do not make them difficult (Bukhari 69).</li><li><b>Small, steady steps are best.</b>The deeds God loves most are those done regularly, even if they are small (Bukhari 6464).</li><li><b>Be good to your family.</b>The Quran says to treat your parents well, even when they don't share your faith (31:14–15).</li><li><b>You may keep your name.</b>You don't need to change your name to become Muslim, unless it has a bad meaning.</li><li><b>Mistakes are part of the path.</b>Tawbah, turning back, is always open. No one is thrown out of Islam for forgetting a prayer or making mistakes.</li><li><b>Find a community.</b>A mosque, a study circle or other new Muslims make it easier. You don't have to walk the path alone.</li><li><b>Beware of extremes.</b>Anyone who promises you secret knowledge, special signs or that you are chosen is not showing you Islam's way. Islam is open, calm and built on sources anyone can check.</li><li><b>Always ask.</b>There are no stupid questions. Ask an imam, a teacher, or use Ask Nur.</li>",
 helpBarTxt:"Is it getting too much? Help is always here.",helpBtn:"Help to find calm",helpEy:"Help",helpH:"When it gets too much",
 helpNote:"It is completely normal to feel overwhelmed by new knowledge. Islam is learned over many years, not in one night. Put the big things down for a moment.",
 helpBody:"<section><h3>What Islam itself says</h3><ul><li>The Prophet said: make things easy, and do not make them difficult (Bukhari 69).</li><li>Seek refuge with the short words: <i>A'udhu billahi min ash-shaytan ir-rajim</i>, I seek refuge with God from the accursed Satan.</li><li>Read the last two surahs, al-Falaq and an-Nas. An-Nas is about seeking protection from whispering (waswasa).</li><li>Your body has a right over you. Sleep, eat, take a walk, and take a break from reading.</li></ul></section><section><h3>Talk to a person</h3><p>An imam, a friend or someone in your family. You don't have to carry it all alone, and a conversation helps more than more knowledge.</p></section><section class='care'><h3>If whispers feel like voices</h3><p>If you hear voices others don't hear, aren't sleeping, or get a strong feeling that everything is about you or that you are chosen, talk to a doctor. Many imams say the same: whispering and illness are two different things, and seeking treatment does not go against faith. The Prophet said: seek treatment, for God has not created a disease without also creating a remedy for it (Abu Dawud 3855).</p><p><b>Help:</b> contact a crisis line in your country · <b>Emergency in Europe:</b> 112</p></section>",

async function hentSprog(code){if(code==="da"||code==="en"||filer[code]||!FILLANG.has(code))return true;
  ld.show(langName(code),"",null);

let sampleFn=null,kanBilleder=false;
const MODEL="claude-sonnet-5-5";
const egenNoegle=()=>ls.get("nur_key","");
const harAI=()=>!!sampleFn||!!egenNoegle();
function noteAI(){const ok=harAI();document.getElementById("cnote").textContent=ok?t("aiNote"):t("needAI");
  document.getElementById("csend").disabled=!ok;document.getElementById("s-go").disabled=!ok;document.getElementById("translate").disabled=!ok}
const fileB64=f=>new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result).split(",")[1]);fr.onerror=j;fr.readAsDataURL(f)});
async function ai(input,{json=false,onText,signal,images,maxTokens=2000}={}){
  if(sampleFn){const o={cache:false};if(signal)o.signal=signal;if(onText)o.onText=onText;if(images)o.images=images;
    return json?await sampleFn.json(input,o):(await sampleFn(input,o)).text}
  const key=egenNoegle();if(!key)throw{code:"no_ai"};
  let msgs=typeof input==="string"?[{role:"user",content:input}]:input;
  if(images&&images.length){const blocks=[];for(const f of images)blocks.push({type:"image",source:{type:"base64",media_type:f.type||"image/jpeg",data:await fileB64(f)}});
    const last=msgs[msgs.length-1];msgs=[...msgs.slice(0,-1),{role:"user",content:[...blocks,{type:"text",text:last.content}]}]}
  let res;try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal,headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:MODEL,max_tokens:maxTokens,messages:msgs})})}catch(e){throw e&&e.name==="AbortError"?{code:"aborted"}:{code:"network"}}
  if(res.status===401||res.status===403)throw{code:"bad_key"};if(res.status===429)throw{code:"rate_limited"};if(!res.ok)throw{code:"http"};
  const j=await res.json();const text=(j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
  if(onText)onText({text});
  if(!json)return text;const m=text.match(/[\[{][\s\S]*[\]}]/);if(!m)throw{code:"parse"};return JSON.parse(m[0])}
const fejlTxt=e=>({not_granted:t("notGranted"),rate_limited:t("rateLimited"),aborted:t("stopped"),bad_key:t("badKey"),no_ai:t("needAI")}[e&&e.code]||t("genericErr"));

function drawPattern(){const c=document.getElementById("pattern");if(!c||!c.offsetWidth)return;
  const r=window.devicePixelRatio||1,w=c.offsetWidth,h=c.offsetHeight;c.width=w*r;c.height=h*r;const x=c.getContext("2d");x.scale(r,r);
  x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--gold").trim()||"#D4AF6A";x.lineWidth=.7;const s=56;
  for(let i=-1;i<w/s+1;i++)for(let j=-1;j<h/s+1;j++){const cx=i*s+s/2,cy=j*s+s/2,a=s*.34;x.globalAlpha=.55*Math.max(0,1-(cy/h)*1.1);
    for(const rot of[0,Math.PI/4]){x.beginPath();for(let k=0;k<4;k++){const q=rot+k*Math.PI/2;x.lineTo(cx+Math.cos(q)*a*1.41,cy+Math.sin(q)*a*1.41)}x.closePath();x.stroke()}
    x.beginPath();x.arc(cx,cy,a*.42,0,Math.PI*2);x.stroke()}}
addEventListener("resize",drawPattern);

const NUR=()=>`You are "Nur", a calm and kind helper in an app for new Muslims and people exploring Islam. The app was made by Malik, a Danish Muslim.

YOUR TASK
- Help the user reflect on their life with Islam's own tools: istikhara (the prayer for guidance in decisions, Bukhari 1162), sabr (patience), shukr (gratitude), tawakkul (trust in God), du'a (personal prayer) and the understanding of qadar.
- Explain the basics simply: the five pillars, salah, wudu, du'a, al-Fatiha, the history of Islam.
- Cite verses (surah:verse) and hadith (collection and number) ONLY when you are sure. If unsure, say so and point to quran.com or sunnah.com.
- Mainstream Sunni practice as default; briefly note where the schools of law differ. Be respectful of Shia Muslims and other faiths.

LIMITS YOU ALWAYS KEEP
- NEVER interpret events, dreams, numbers, names, dates or coincidences in the user's life as signs, messages or omens from God. If the user says something is a sign for them, acknowledge the feeling kindly and explain that Islam warns against reading omens (tiyara, Abu Dawud 3910) and that no new revelation comes after Muhammad, the seal of the prophets (Quran 33:40). Point to istikhara and a conversation with an imam.
- Never say anyone is chosen, a prophet, the Mahdi, on a special mission or receiving revelation.
- Do not issue fatwas. Refer personal religious rulings kindly to an imam or local mosque.
- Do not comment on the user's mental health unless the user says they want to harm themselves or others, or are in danger. Only then: answer calmly and warmly and tell them to contact a local crisis line or emergency number (in Denmark: Livslinien 70 201 201, emergency 112).

STYLE
- Talk like a warm, grounded older sibling in the faith having a real conversation, not like a lecturer or a textbook. Relaxed everyday language, like texting a friend you trust.
- ${ADDR()}
- Keep it short: usually 2-5 sentences. One thought at a time. Ask a natural follow-up question when it helps the conversation move, instead of covering everything at once.
- Show you heard them: reflect briefly what they said before answering.
- Light, kind humour is fine. Never preachy, never guilt-tripping.
- Always answer in the language the user writes in. No headings, no bullet lists unless they ask for steps.
- You are a helper in an app, not a replacement for real people. When it fits, nudge them toward their mosque, friends or family too.`;

  au.onplay=()=>{ic.setAttribute("d",pause);document.getElementById("pl-btn").setAttribute("aria-label","Pause")};
  au.onpause=()=>{ic.setAttribute("d",play);document.getElementById("pl-btn").setAttribute("aria-label","Play")};
  au.onended=()=>{brændt();au.removeAttribute("src");au.load()};
  au.onerror=()=>{pl.hidden=true}})();

/* ================= INSTALLÉR SOM APP ================= */
(()=>{let evt=null;const btn=document.getElementById("install");
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if("serviceWorker" in navigator&&location.protocol==="https:"&&!location.hostname.endsWith("claude.ai")&&!location.hostname.includes("claudeusercontent")){
    navigator.serviceWorker.register("sw.js").catch(()=>{})}
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();evt=e;if(!standalone)btn.hidden=false});
  btn.onclick=async()=>{if(!evt)return;evt.prompt();try{await evt.userChoice}catch(e){}evt=null;btn.hidden=true};
  addEventListener("appinstalled",()=>{btn.hidden=true});
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);if(ios&&!standalone)document.getElementById("ios-hint").hidden=false})();
</script>

# Bygger iPhone-appen i skyen hos Codemagic (de har Mac'er), så du ikke selv skal have en Mac.
# Den sendes direkte til TestFlight i App Store Connect. Se .mobil/README.md → "iPhone".
workflows:
  ios-testflight:
    name: iPhone til TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: .mobil
    integrations:
      app_store_connect: GetTogether   # det navn, du gav din App Store Connect-nøgle i Codemagic
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dk.gettogether.app
    scripts:
      - name: Installer
        script: npm install
      - name: Lav iOS-projektet og kopier hjemmesiden ind
        script: |
          if [ -d ios ]; then
            GT_BUILD=$BUILD_NUMBER npm run klar
          else
            GT_BUILD=$BUILD_NUMBER npm run ios:opret
          fi
      - name: Signering
        script: xcode-project use-profiles
      - name: Byg appen
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
